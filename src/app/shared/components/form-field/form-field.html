<div class="form-control w-full">
  @if (label) {
    <label class="label">
      <span class="label-text font-bold opacity-70">{{ label }}</span>
    </label>
  }

  <ng-content></ng-content>

  @if (hasError) {
    <label class="label animate-in slide-in-from-top-1 duration-200">
      <span class="label-text-alt text-error font-medium">
        {{ errorMsg || 'Este campo es requerido o contiene errores' }}
      </span>
    </label>
  }
</div>
